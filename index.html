<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="valo-ui" content="74">
<title>VALO-READOUT</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'><rect%20width='256'%20height='256'%20rx='46'%20fill='%23111a1f'/><g%20fill='%23f5a63c'><rect%20x='104'%20y='20'%20width='48'%20height='66'%20rx='9'/><rect%20x='104'%20y='170'%20width='48'%20height='66'%20rx='9'/><rect%20x='20'%20y='104'%20width='66'%20height='48'%20rx='9'/><rect%20x='170'%20y='104'%20width='66'%20height='48'%20rx='9'/><circle%20cx='128'%20cy='128'%20r='27'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#090c11;
  --panel:#131920;
  --panel-2:#0e131a;
  --away:#0c1015;
  --raise:#1c242e;
  --rule:#243040;
  --hair:#1a232d;
  --ivory:#eef2f5;
  --muted:#93a1ae;
  --dim:#66757f;
  --signal:#f5a63c;
  --rose:#e04a6b;
  --win:#2ec27e;
  --cyan:#3fc7dd;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --disp:"Cascadia Mono",Consolas,ui-monospace,monospace;

  --t-iron:#7a8388;
  --t-bronze:#b07a45;
  --t-silver:#c2cbd1;
  --t-gold:#e8c25a;
  --t-plat:#42b7c6;
  --t-diamond:#c48af0;
  --t-ascendant:#2ec27e;
  --t-immortal:#e5486d;
  --t-radiant:#fff0b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground);color:var(--ivory);
  font-family:var(--disp);
  -webkit-font-smoothing:antialiased;
}

.label,thead th,.cell .k,.team .th,.card h2,.dlghead h2,button.act,.pill,
.wordmark,.rk,.foot,.logline .lv,.roster td.ag,td.map,td.mp,td.agent,.tiername{
  font-family:var(--disp);text-transform:uppercase;
}

.label,thead th,.cell .k{
  font-size:10px;font-weight:600;letter-spacing:.17em;color:var(--dim);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero"}

.shell{max-width:1400px;margin:0 auto;padding:0 24px 64px;min-height:100%}

.top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:18px;padding:10px 10px 10px 18px;
  background:var(--panel);border:1px solid var(--hair);border-left:2px solid var(--signal);
}

.brand{
  display:flex;align-items:center;gap:12px;flex:none;
  padding-right:20px;margin-right:4px;border-right:1px solid var(--rule);
}
.mark{
  width:26px;height:26px;flex:none;display:block;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--signal) 40%,transparent));
}
.wordmark{font-weight:700;font-size:17px;letter-spacing:.2em;color:var(--ivory)}
.wordmark span{color:var(--signal)}

.chips,.seg{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);flex:none}
.pill{
  display:flex;align-items:center;gap:9px;
  padding:9px 14px;background:var(--panel-2);
  font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);
}
.pill[hidden]{display:none}
.pill.hot{color:var(--signal);background:color-mix(in srgb,var(--signal) 12%,var(--panel-2))}

.pill#sidePill{font-weight:700;letter-spacing:.22em;padding:9px 18px}
.pin{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.1}
.pill.atk{background:var(--rose);color:#14070c}
.pill.def{background:var(--cyan);color:#03161a}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.pill.hot .dot{
  background:var(--signal);box-shadow:0 0 8px var(--signal);
  animation:beat 1.9s ease-in-out infinite;
}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.top .spacer{flex:1}

.who{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  letter-spacing:normal;text-transform:none;font-weight:400;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.who b{color:var(--ivory);font-weight:600}
.actions{display:flex;align-items:center;gap:10px;flex:none}
button.act{
  font-size:11px;font-weight:600;letter-spacing:.14em;
  background:none;color:var(--muted);border:1px solid var(--rule);border-radius:2px;
  padding:7px 13px;cursor:pointer;transition:color .15s,border-color .15s,background-color .15s;
}
button.act:hover{color:var(--ivory);border-color:var(--muted)}
button.act:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.top button.act{padding:9px 16px;background:var(--panel-2);border-radius:0}
.seg button.act{border:0}
.seg button.act:hover{background:var(--raise)}
.top button.act.danger:hover{
  color:var(--rose);border-color:var(--rose);
  background:color-mix(in srgb,var(--rose) 12%,var(--panel-2));
}

.banner{
  margin-top:16px;padding:13px 16px;border-left:2px solid var(--signal);
  background:var(--panel);font-family:var(--mono);font-size:12px;line-height:1.55;
  color:var(--muted);
}
.banner b{color:var(--ivory);font-weight:600}
.banner.bad{border-left-color:var(--rose)}
.banner[hidden]{display:none}

.body{padding-top:20px}
@media (prefers-reduced-motion:reduce){
  .pill.hot .dot{animation:none}
  .rrfill{transition:none}
}

.readouts{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{
  --py:18px;--px:22px;--edge:var(--signal);
  min-width:0;padding:var(--py) var(--px);
  background:linear-gradient(180deg,var(--panel) 0,color-mix(in srgb,var(--panel) 45%,var(--panel-2)) 100%);
  border:1px solid var(--hair);border-left:2px solid var(--edge);
  transition:border-color .15s;
}
.card.rankcard{--edge:var(--tc)}
.card.folded{--edge:var(--rule)}
.card h2,.dlghead h2{
  font-size:14px;font-weight:700;letter-spacing:.2em;
  color:var(--ivory);margin-bottom:16px;
}
.card > h2:first-child{
  margin:calc(-1 * var(--py)) calc(-1 * var(--px)) 18px;
  padding:var(--py) var(--px) 0;
}
.card > h2:first-child > span:first-child:not(.sparisce)::before,#rosterTitle::before{
  content:"";display:inline-block;width:7px;height:7px;margin:0 14px 0 1px;
  vertical-align:2px;background:var(--edge);transform:rotate(45deg);
  transition:background-color .15s;
}

#rosterCard{--py:22px;padding-bottom:24px}
#rosterCard h2{font-size:16px}
#rosterTitle{display:flex;align-items:center}
.sparisce{
  margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--muted);
}
.sparisce b{color:var(--signal);font-variant-numeric:tabular-nums}
.sparisce i{
  display:block;height:2px;margin-top:7px;background:var(--signal);
  transform-origin:left;animation:svuota 15s linear forwards;
}
@keyframes svuota{to{transform:scaleX(0)}}
#rosterCard.uscita .teams{opacity:.7;transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.sparisce i{display:none}}

.card h2.fold{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;user-select:none;
}

.card h2.rankhead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
}

.foldbtn,.xbtn{
  flex:none;width:28px;height:24px;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel-2);color:var(--dim);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  font-family:var(--mono);font-size:15px;line-height:1;
  transition:color .15s,border-color .15s;
}
.foldbtn::after{content:"−"}
.xbtn::after{content:"×"}
.foldbtn:hover,.xbtn:hover,h2.fold:hover .foldbtn{color:var(--ivory);border-color:var(--muted)}
.foldbtn:focus-visible,.xbtn:focus-visible{
  outline:2px solid var(--signal);outline-offset:2px;
}
.card.folded > h2.fold{margin-bottom:calc(-1 * var(--py));padding-bottom:var(--py)}
.card.folded .foldbtn::after{content:"+"}
.card.folded > :not(h2){display:none}
.card.folded:hover{--edge:var(--signal)}
.card.folded:hover > h2.fold{
  background:linear-gradient(90deg,color-mix(in srgb,var(--signal) 16%,var(--raise)),var(--raise) 60%);
}
.card.folded:hover .foldbtn{color:var(--signal);border-color:var(--signal)}

.teams{display:flex;flex-direction:column;gap:0}
.team{background:transparent;padding:0 0 6px}
.teams > .team{
  border:1px solid var(--rule);border-radius:3px;
  padding:14px 16px 12px;margin:0;
}
.teams > .team{background:var(--panel-2)}
.teams > .team:last-child:not(:first-child){margin-top:14px}

#rosterCard.atk .teams > .team:first-child,
#rosterCard.def .teams > .team:last-child:not(:first-child){
  border-color:var(--rose);box-shadow:inset 0 0 0 1px rgba(224,74,107,.22);
}
#rosterCard.def .teams > .team:first-child,
#rosterCard.atk .teams > .team:last-child:not(:first-child){
  border-color:var(--win);box-shadow:inset 0 0 0 1px rgba(46,194,126,.22);
}
#rosterCard.atk .teams > .team:first-child .th,
#rosterCard.def .teams > .team:last-child:not(:first-child) .th{color:var(--rose)}
#rosterCard.def .teams > .team:first-child .th,
#rosterCard.atk .teams > .team:last-child:not(:first-child) .th{color:var(--win)}
.team .th{
  display:block;padding-bottom:12px;
  font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted);
}

.team .th em{font-style:normal;color:var(--dim);letter-spacing:.1em;font-weight:600}
table.roster{table-layout:fixed;margin-top:2px}
.roster th,.roster td{padding-right:9px}
.roster th:last-child,.roster td:last-child{padding-right:0}
.roster td{padding-top:9px;padding-bottom:9px}

.roster tbody td{height:40px;line-height:1.2}
.roster .rk{max-width:100%;overflow:hidden}
table.roster > tbody > tr:last-child > td{border-bottom:none}
.roster .ag{width:100px}
.roster .lv{width:44px}
.roster .gm{width:52px}
.roster .cp{width:30px}
.copybtn{
  position:relative;
  width:22px;height:22px;padding:0;cursor:pointer;
  background:none;border:1px solid var(--rule);border-radius:2px;
  color:var(--dim);
  transition:color .15s,border-color .15s;
}
.copybtn::before,.copybtn::after{
  content:"";position:absolute;box-sizing:border-box;
}
.copybtn::before{
  left:4px;top:4px;width:9px;height:9px;
  border-left:1px solid currentColor;border-top:1px solid currentColor;
}
.copybtn::after{
  left:7px;top:7px;width:9px;height:9px;
  border:1px solid currentColor;border-radius:1px;
}
.copybtn:hover{color:var(--ivory);border-color:var(--muted)}
.copybtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.copybtn.fatto{color:var(--win);border-color:var(--win)}
.copybtn.fatto::before{
  left:8px;top:4px;width:5px;height:10px;
  border:0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(40deg);
}
.copybtn.fatto::after{display:none}
.copybtn.male{color:var(--rose);border-color:var(--rose)}
.copybtn.male::before,.copybtn.male::after{
  left:4px;top:10px;width:12px;height:0;
  border:0;border-top:2px solid currentColor;border-radius:0;
}
.copybtn.male::before{transform:rotate(45deg)}
.copybtn.male::after{transform:rotate(-45deg)}
.roster td.gm{color:var(--dim);font-size:11px}
.metbadge{
  display:inline-block;margin-left:7px;padding:0 5px;
  font-family:var(--mono);font-size:9.5px;line-height:15px;font-weight:500;
  background:var(--raise);border:1px solid transparent;border-radius:2px;
  color:var(--muted);vertical-align:1px;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.metbadge:hover,.metbadge.aperta{color:var(--ivory);border-color:var(--muted)}
.metbadge:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.metrow[hidden]{display:none}
.metrow > td{padding:0 0 10px 0;border-bottom:none}
.metbox{
  border-left:2px solid var(--rule);padding:13px 0 14px 18px;margin-left:112px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);
}
.metstat{
  display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start;
  padding-bottom:13px;margin-bottom:12px;border-bottom:1px solid var(--hair);
}
.mfig .mv{
  font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;
  color:var(--ivory);font-variant-numeric:tabular-nums;
}
.mfig .mv.good{color:var(--win)}
.mfig .mv.bad{color:var(--rose)}
.mfig .mk{
  margin-top:6px;font-size:9.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
}
.metlist{display:flex;gap:52px;flex-wrap:wrap;align-items:flex-start}
.roster .metlist table{flex:0 0 auto;width:auto}
.metbox .metvia{
  color:var(--dim);margin-top:8px;font-size:10px;
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;
}
.roster .metbox td.res{width:15px;padding-right:11px}
.roster .metbox td.res i{width:3px;height:12px;vertical-align:-2px}
.roster .metbox table{width:auto;border-collapse:collapse;table-layout:auto}
.roster .metbox td{
  height:auto;padding:3px 20px 3px 0;line-height:1.55;text-align:left;
  white-space:nowrap;color:var(--muted);border-bottom:none;
  font-family:var(--mono);text-transform:uppercase;font-size:10.5px;
  font-weight:600;letter-spacing:.08em;
}
.roster .metbox td.mw{color:var(--win)}
.roster .metbox td.ml{color:var(--rose)}
.roster .metbox td.mq{color:var(--ivory)}
.roster .metbox td.ms{color:var(--dim)}
.roster .k,.roster .s{width:42px}
.roster .h,.roster .w{width:48px}
.roster .r{width:210px}
.roster .la{width:192px}
.roster .pk{width:266px}

.roster th.r,.roster td.r,.roster th.la,.roster td.la,.roster th.pk,.roster td.pk{text-align:left}
.roster th.r,.roster td.r{padding-left:18px}
.roster td.ag,.roster td.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster td.ag{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
.roster td.nm{
  color:var(--ivory);font-family:var(--disp);font-size:15px;font-weight:600;
  letter-spacing:.02em;text-transform:none;
}
.roster td.nm .anon{
  display:inline-flex;align-items:center;gap:9px;vertical-align:-1px;
  color:var(--dim);font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
}
.anon svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.roster td.lv{color:var(--dim);font-size:11px}
.roster td.k,.roster td.s,.roster td.h,.roster td.w,.roster td.gm{color:var(--muted)}
table.roster > tbody > tr.pari > td{background:rgba(255,255,255,.022)}
table.roster > tbody > tr:not(.metrow):hover > td{background:var(--raise)}
.roster td.r,.roster td.la,.roster td.pk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster td.r.stale .rk{opacity:.45}
.roster tr.me td.ag{color:var(--signal)}
.roster tr.me td.nm{color:var(--signal);font-weight:700}
.roster tr.soft td.ag{color:var(--dim);font-style:italic}
.roster td.pending{color:var(--dim)}

.roster td.nm a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.roster td.nm a:hover{border-bottom-color:currentColor}
.roster td.nm a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.rk{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  color:var(--c,var(--dim));white-space:nowrap;
}
.rk::before{
  content:"";width:11px;height:11px;flex:none;
  background:var(--c,var(--dim));clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.rk.ico::before{
  width:23px;height:23px;margin:0 3px 0 -2px;clip-path:none;
  background:var(--i) center/contain no-repeat;
}

.rk .lbl{display:inline-block;min-width:92px}
.rk .act{color:var(--dim);letter-spacing:.02em;font-weight:600;font-size:9.5px}
.teamnote{font-family:var(--mono);font-size:11px;color:var(--muted);
  line-height:1.6;padding:12px 0 4px}

.rankcard{--tc:var(--dim);--rientro:34px}
.rankcard:has(.tiername.ico){--rientro:90px}
.rankrow{
  display:flex;align-items:center;justify-content:space-between;
  gap:32px;flex-wrap:wrap;padding:20px 0 26px;margin-top:4px;
}
.rkmain{min-width:0;flex:1 1 440px;max-width:780px}
.tiername{
  display:flex;align-items:center;gap:18px;
  font-weight:700;font-size:48px;letter-spacing:.03em;line-height:1;
}
.tiername::before{
  content:"";width:16px;height:16px;flex:none;
  background:currentColor;transform:rotate(45deg);
}
.tiername.ico{gap:16px}
.tiername.ico::before{
  width:74px;height:74px;transform:none;margin:-8px 0;
  background:var(--i) center/contain no-repeat;
  filter:drop-shadow(0 0 22px color-mix(in srgb,currentColor 65%,transparent));
}
.rkmain .label{display:block;margin:12px 0 0 var(--rientro)}
.rrwrap{
  display:flex;align-items:center;gap:18px;
  margin:18px 0 0 var(--rientro);max-width:600px;
}
.rrbar{
  flex:1;height:12px;position:relative;background:var(--raise);
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
}
.rrbar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 3px),var(--panel) calc(25% - 3px) 25%);
}
.rrfill{
  position:absolute;inset:0 auto 0 0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,var(--ground)),var(--tc));
  transition:width .7s cubic-bezier(.2,.7,.2,1);
}
#rrText{
  flex:none;font-size:26px;color:var(--ivory);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;
}
#rrText small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.14em;margin-left:6px}
.rkpeak{
  flex:none;min-width:230px;padding:16px 22px 18px 18px;
  background:var(--panel-2);border:1px solid var(--rule);
}
.rkpeak .label{display:block;margin-bottom:12px}
.rkpeak .pk{display:flex;align-items:center;gap:14px}
.rkpeak .pk i{width:40px;height:40px;flex:none;background:var(--i) center/contain no-repeat}
.rkpeak .pk i.dot{width:12px;height:12px;margin:0 6px;transform:rotate(45deg)}
.rkpeak .pk b{display:block;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.rkpeak .pk em{
  display:block;margin-top:5px;font-style:normal;font-size:10px;
  color:var(--muted);letter-spacing:.12em;text-transform:uppercase;
}

#aggTitle{
  font-size:10px;font-weight:600;letter-spacing:.17em;color:var(--dim);
  text-transform:uppercase;margin:20px 0 0;
}
#aggTitle[hidden]{display:none}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:var(--hair);border:1px solid var(--hair);margin-top:16px;
}

.cell{
  --tono:var(--rule);
  background:var(--panel-2);padding:16px 20px 18px;
  box-shadow:inset 0 2px 0 var(--tono);
}
.cell.good{--tono:var(--win)}
.cell.bad{--tono:var(--rose)}
.cell .v{
  font-family:var(--mono);font-size:28px;font-weight:700;color:var(--ivory);
  font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;
}
.cell .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.cell .k{margin-bottom:12px;white-space:nowrap;letter-spacing:.12em}
.cell.good .v{color:var(--win)}
.cell.bad .v{color:var(--rose)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.tile{
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px 16px;
  padding:16px 20px 18px;background:var(--panel-2);border:1px solid var(--hair);
}
.tile .label{grid-column:1 / -1}

}

  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;

}

.tile .ts.bad{color:var(--rose)}

}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}

thead th:first-child,tbody td:first-child{text-align:left}
tbody td{padding:10px 0;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
td.res{width:20px;text-align:left}
td.res i{display:inline-block;width:3px;height:15px;vertical-align:-3px}
td.res i.w{background:var(--win)}
td.res i.l{background:var(--rose)}
td.res i.d{background:var(--dim)}
td.arte{

td.map,td.mp{color:var(--ivory);font-size:12px;font-weight:600;letter-spacing:.12em}
td.map{width:20%}
td.agent{
  width:16%;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.11em;
}
td.rr.up{color:var(--win)}
td.rr.down{color:var(--rose)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:430px}
.empty{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}

#updCard{
  margin:auto;
  max-width:520px;width:calc(100% - 48px);
  background:var(--panel);color:var(--ivory);
  border:1px solid var(--rule);border-radius:3px;
  padding:22px 24px 24px;
}
#updCard::backdrop{background:rgba(4,6,9,.78)}
.updnote{
  font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--muted);
  margin-bottom:16px;max-width:56ch;
}
.updnote b{color:var(--ivory);font-weight:600}
.updnote a{color:var(--signal)}
.updrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.updbar{
  height:6px;background:var(--panel-2);margin-bottom:14px;overflow:hidden;
  border-radius:2px;
}
.updbar[hidden]{display:none}
.updbar i{display:block;height:100%;width:0;background:var(--signal);
  border-radius:2px;transition:width .3s ease}
#keyCard{
  margin:auto;
  max-width:600px;width:calc(100% - 48px);
  background:var(--panel);color:var(--ivory);
  border:1px solid var(--rule);border-radius:3px;
  padding:22px 24px 24px;
}
#keyCard::backdrop{background:rgba(4,6,9,.78)}
.dlghead{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:16px;
}
.dlghead h2{margin-bottom:0}

.keynote{
  font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--muted);
  margin-bottom:14px;max-width:62ch;
}
.keynote a{color:var(--signal)}
.keyrow{display:flex;gap:10px;align-items:stretch;max-width:520px}
#keyInput{
  flex:1;min-width:0;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  background:var(--panel-2);color:var(--ivory);border:1px solid var(--rule);
  border-radius:2px;padding:9px 12px;
}
#keyInput::placeholder{color:var(--dim)}
#keyInput:focus{outline:none;border-color:var(--signal)}
#keySave{padding:0 18px}

#keyEye{padding:0 12px;min-width:98px}
.keymsg{font-family:var(--mono);font-size:11.5px;margin-top:11px;min-height:1em}
.keymsg.ok{color:var(--win)}
.keymsg.bad{color:var(--rose)}

.logwrap{max-height:280px;overflow-y:auto;font-family:var(--mono);font-size:11.5px}
.logline{display:flex;gap:12px;padding:4px 0;line-height:1.5;align-items:baseline}
.logline + .logline{border-top:1px solid var(--hair)}
.logline .lt{color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.logline .lv{
  flex:none;width:64px;font-size:9.5px;font-weight:600;letter-spacing:.16em;
  color:var(--dim);
}
.logline .lm{color:var(--muted);min-width:0;word-break:break-word}
.logline.warning .lv,.logline.warning .lm{color:var(--signal)}
.logline.error .lv,.logline.error .lm{color:var(--rose)}

table.hist{table-layout:fixed}
.hist th.res{width:76px}
.esito{
  display:inline-block;min-width:58px;padding:4px 0 3px;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;
}
.esito.w{color:var(--win);background:rgba(46,194,126,.1)}
.esito.l{color:var(--rose);background:rgba(224,74,107,.1)}

.esito.tot{color:var(--signal);background:rgba(245,166,60,.08);letter-spacing:.06em}
.hist th.map{width:18%}
.hist th.agent{width:15%}
.hist td.good{color:var(--win)}
.hist td.bad{color:var(--rose)}
.hist tfoot td{

}
.hist tfoot td.l{text-align:left;padding-left:12px;color:var(--muted);font-size:11px;letter-spacing:.15em}

table.maps td{padding:11px 0}

table.maps:not(.acts){table-layout:fixed}
.maps:not(.acts) th.mp{width:34%}
.maps:not(.acts) th.wr{width:auto}
.maps th.mp{width:38%}
.maps th.wr,.maps td.wr{width:88px;font-weight:600;color:var(--ivory)}
.maps td.wr.good{color:var(--win)}
.maps td.wr.bad{color:var(--rose)}
.maps:not(.acts) th.mp{width:26%}
.maps:not(.acts) th.wr,.maps:not(.acts) td.wr{width:118px}
.wrbar{display:inline-block;width:46px;height:3px;margin-right:10px;vertical-align:middle;background:var(--rule)}
.wrbar i{display:block;height:100%;background:currentColor}
.maps th.ba,.maps td.ba{width:21%;padding-left:28px}
.maps td.ba{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
.wrnum{display:inline-block;min-width:4.5ch;text-align:right}
.maps td.good{color:var(--win)}
.maps td.bad{color:var(--rose)}

.acts td.mp{font-size:11px;letter-spacing:.15em}
.acts td.mp em.dim{font-style:normal;color:var(--dim);font-size:10px}
.acts th.pk,.acts td.pk{text-align:left;width:172px}

.acts td.part{color:var(--dim)}
.acts th.mp{width:28%}
.maps td.w{color:var(--muted)}
.maps td.w.has{color:var(--win)}
.maps td.ls{color:var(--muted)}

.loadbar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--rule);overflow:hidden;z-index:60}
.loadbar[hidden]{display:none}

body.offline .top{border-color:var(--signal)}

.foot{

.foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}

    atk:"attack", def:"defense",
    actsTitle:"All acts", actCol:"act",
    hide:"hide", show:"show",
    onSample:"computed on the {n} matches the archive kept",
    keyBtn:"key", keyShow:"show", keyHide:"hide",
    keySave:"save", keyWait:"checking…",
    keyOk:"Key saved. Recomputing averages.",
    keyNew:"Key saved. The archive does not know this account yet: it fills in "

};
let lang = localStorage.getItem("valoLang") === "en" ? "en" : "it";
const t = (k) => (I18N[lang][k] ?? k);

const tb = (it, en) => (lang === "en" ? (en || it) : it) || "";
let lastState = null;

let keyOpen = false, keyAsked = false;

function applyStatic() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-i18n]"))
    el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]"))
    el.innerHTML = t(el.dataset.i18nHtml);
  $("langBtn").textContent = t("other");
  $("keyEye").textContent = t($("keyInput").type === "text" ? "keyHide" : "keyShow");
}

function setLang(next) {
  lang = next;
  localStorage.setItem("valoLang", lang);
  applyStatic();
  applyFolds();
  if (lastState) render(lastState);
}

const LOOP_LABEL = {
  MENUS:{it:"nei menu",en:"in menus"}, PREGAME:{it:"agent select",en:"agent select"},
  INGAME:{it:"in partita",en:"in game"}, AWAY:{it:"assente",en:"away"},
  OFFLINE:{it:"offline",en:"offline"},
};

function render(s) {
  lastState = s;
  const live = s.live || {};
  const rank = s.rank || {};
  const agg  = s.recent || {};
  const inGame = live.loopState === "INGAME" || live.loopState === "PREGAME";

  const pill = $("statePill");
  pill.classList.toggle("hot", inGame);
  $("stateText").textContent = s.bridge === "error" ? t("error")
    : s.bridge === "waiting_game" ? t("noGame")
    : ((LOOP_LABEL[live.loopState] || {})[lang] || t("menus"));

  const chip = (id, txt, value) => {
    const el = $(id);
    el.hidden = !value || value === "—";
    if (!el.hidden) $(txt).textContent = value;
  };
  chip("modePill", "modeText", (s.roster || {}).queue || live.queue);
  chip("mapPill", "mapText", (s.roster || {}).map || live.map);
  chip("serverPill", "serverText", (s.roster || {}).server);
  mostraCarico(!!s.refreshing);
  mostraAggiornamento(s.update || {}, s.appVersion || "");
  mostraVersione(s.appVersion || "");
  const lato = (s.roster || {}).side;
  chip("sidePill", "sideText", lato ? t(lato === "attacco" ? "atk" : "def") : "");
  $("sidePill").classList.toggle("atk", lato === "attacco");
  $("sidePill").classList.toggle("def", lato === "difesa");
  const vista = rosterDaMostrare(s.roster || {});
  $("rosterCard").classList.toggle("atk", vista.side === "attacco");
  $("rosterCard").classList.toggle("def", vista.side === "difesa");

  const acc = s.account || {};
  $("who").innerHTML = acc.name
    ? `<b>${esc(acc.name)}</b>#${esc(acc.tag || "")} · ${esc((acc.region || "").toUpperCase())}`
    : "&mdash;";

  const b = $("banner");
  if (s.bridge === "error" || s.error) {
    b.hidden = false;
    b.className = "banner bad";
    b.innerHTML = `<b>${t("errTitle")}</b> ${esc(tb(s.error, s.errorEn))}`;
  } else if (s.mock) {
    b.hidden = false;
    b.className = "banner";
    b.innerHTML = `<b>${t("mockTitle")}</b> ${t("mockBody")}`;
  } else {
    b.hidden = true;
  }

  const known = !!(s.account && s.account.name);
  if (s.henrik === false && known && !keyAsked) { keyAsked = true; keyOpen = true; }
  $("keyBtn").hidden = !known;
  const dlg = $("keyCard");
  const vuole = keyOpen && known;
  if (vuole && !dlg.open) dlg.showModal();
  else if (!vuole && dlg.open) dlg.close();
  if (known) {
    const ki = $("keyInput");
    if (document.activeElement !== ki) ki.value = s.henrikKey || "";
    const nota = $("keyNote");
    nota.hidden = !!s.henrikKey;
    nota.innerHTML = s.henrikKey ? "" : t("keyBody");
  }

  conIcone = !!s.tierIcons;
  renderRoster(vista);

  $("tierName").textContent = rank.tierName || "—";
  $("tierName").style.color = tierColor(rank.tier);
  $("tierName").classList.toggle("ico", conIcone && rank.tier != null);
  if (conIcone && rank.tier != null) {
    $("tierName").style.setProperty("--i", `url('/tier/${rank.tier}.png')`);
  }
  $("rankCard").style.setProperty("--tc", tierColor(rank.tier));
  $("peakName").innerHTML = rank.peakTier == null ? "—"
    : `<span class="pk"><i${conIcone
        ? ` style="--i:url('/tier/${rank.peakTier}.png')"`
        : ` class="dot" style="background:${tierColor(rank.peakTier)}"`}></i>`
      + `<span><b style="color:${tierColor(rank.peakTier)}">${esc(rank.peakTierName)}</b>`
      + `${rank.peakSeason ? `<em>${esc(rank.peakSeason)}</em>` : ""}</span></span>`;
  $("actLine").textContent = rank.actGames
    ? `${rank.actName || t("actNow")} · ${rank.actWins}${t("colW")} / ${rank.actGames}` : "";

  const dentro = progressoRR(rank.tier, rank.rr);
  $("rrFill").style.width = (dentro == null ? 100 : dentro) + "%";
  $("rrText").innerHTML = rank.rr == null ? "—" : `${esc(rank.rr)}<small>RR</small>`;

  const tot = agg.actGames || 0;
  $("aggTitle").textContent = agg.games && tot > agg.games
    ? `${agg.games} ${t("of")} ${tot} ${t("comp")}` : "";
  $("aggTitle").hidden = !$("aggTitle").textContent;
  arte = s.mapArt || {};
  const tonoWr = agg.winRate >= 55 ? "good" : agg.winRate < 45 ? "bad" : "";
  const riquadro = (k, v, sub, tono, url) =>
    `<div class="tile${url ? " arte" : ""}"${url ? ` style="--arte:url('${esc(url)}')"` : ""}>`
    + `<div class="label k">${k}</div><div class="tv">${esc(v)}</div>`
    + `<div class="ts ${tono}">${esc(sub)}</div></div>`;
  const evidenze = [
    agg.bestAgent ? riquadro(t("topAgent"), agg.bestAgent, `${dec(agg.bestAgentKda)} kda`,
                             agg.bestAgentKda >= 1 ? "good" : "bad") : "",
    agg.bestMap ? riquadro(t("bestMap"), agg.bestMap, `${agg.bestMapWr}% wr`,
                           agg.bestMapWr >= 55 ? "good" : agg.bestMapWr < 45 ? "bad" : "",
                           arte[agg.bestMap]) : "",
  ].join("");
  $("agg").innerHTML = !agg.games
    ? `<div class="grid"><div class="cell"><div class="empty">${t("noComp")}</div></div></div>`
    : `<div class="grid">${[
        cell(t("kda"), dec(agg.kda), null, agg.kda >= 1.2 ? "good" : agg.kda < 0.9 ? "bad" : ""),
        cell(t("kdCell"), dec(agg.kd)),
        cell(t("acsCell"), Math.round(agg.acs)),
        cell(t("hsCell"), agg.hs, "%"),
        cell(t("wrCell"), agg.winRate, "%", tonoWr),
        cell(t("vs"), `${agg.wins}–${agg.losses}`),
        cell(t("kpr"), dec(agg.killsPerRound)),
      ].join("")}</div>${evidenze ? `<div class="hl">${evidenze}</div>` : ""}`;
  $("histBox").innerHTML = !(s.matches || []).length
    ? `<div class="empty">${t("noRecent")}</div>`
    : `<div class="scroll"><table class="hist">
        <thead><tr><th class="res"></th><th class="map l">${t("map")}</th>
        <th class="agent l">${t("agent")}</th>
        <th>${t("colK")}</th><th>${t("colD")}</th><th>${t("colA")}</th>
        <th>${t("kd")}</th><th>${t("kda")}</th>
        <th>${t("acs")}</th><th>${t("hs")}</th><th>${t("colRR")}</th></tr></thead>
        <tbody>${s.matches.map(matchRow).join("")}</tbody>
        <tfoot>${mediaRow(s.matches)}</tfoot></table></div>`;

  const acts = s.acts || [];
  $("actsCard").hidden = !acts.length;
  if (acts.length) $("actsBox").innerHTML = `<div class="scroll"><table class="maps acts">
        <thead><tr><th class="l mp">${t("actCol")}</th><th class="l pk">${t("peak")}</th>
        <th class="wr">${t("wr")}</th>
        <th>${t("colW")}</th><th>${t("colL")}</th><th>${t("kd")}</th>
        <th>${t("acs")}</th><th>${t("hs")}</th></tr></thead>
        <tbody>${acts.map(actRow).join("")}</tbody></table></div>`;

  const maps = agg.maps || [];
  $("mapsBox").innerHTML = !maps.length
    ? `<div class="empty">${t("noComp")}</div>`
    : `<div class="scroll"><table class="maps">
        <thead><tr><th class="l mp">${t("map")}</th><th class="wr">${t("wr")}</th>
        <th>${t("colW")}</th><th>${t("colL")}</th><th>${t("kd")}</th><th>${t("kda")}</th>
        <th>${t("acs")}</th><th>${t("hs")}</th><th class="ba l">${t("topAgent")}</th></tr></thead>
        <tbody>${maps.map(mapRow).join("")}</tbody></table></div>`;

  const loc = lang === "en" ? "en-GB" : "it-IT";
  const lines = s.log || [];
  const box = $("logBox");
  box.innerHTML = !lines.length
    ? '<div class="empty">—</div>'
    : `<div class="logwrap" id="logWrap">${lines.map((e) => `
        <div class="logline ${esc((e.level || "").toLowerCase())}">
          <span class="lt">${new Date(e.at * 1000).toLocaleTimeString(loc)}</span>
          <span class="lv">${esc(e.level || "")}</span>
          <span class="lm">${esc(tb(e.text, e.en))}</span>
        </div>`).join("")}</div>`;
  const wrap = $("logWrap");
  if (wrap) wrap.scrollTop = wrap.scrollHeight;

  $("stamp").textContent = s.updatedAt
    ? t("updated") + " " + new Date(s.updatedAt * 1000).toLocaleTimeString(loc) : "—";
}

const TENUTA_MS = 15000;
let ultimaPartita = null, tenuta = null, contoTenuta = null;

function rosterDaMostrare(r) {
  if (r.matchId) {
    ultimaPartita = r.loop === "INGAME" ? r : null;
    tenuta = null;
    return r;
  }
  if (ultimaPartita) {
    tenuta = { roster: ultimaPartita, fine: Date.now() + TENUTA_MS };
    ultimaPartita = null;
    contoTenuta = contoTenuta || setInterval(scorriTenuta, 250);
  }
  if (tenuta && Date.now() < tenuta.fine) return tenuta.roster;
  tenuta = null;
  return r;
}

function scorriTenuta() {
  if (tenuta && Date.now() < tenuta.fine) {
    const n = document.querySelector("#rosterTitle .sparisce b");
    if (n) n.textContent = Math.ceil((tenuta.fine - Date.now()) / 1000);
    return;
  }
  clearInterval(contoTenuta);
  contoTenuta = null;
  if (lastState) render(lastState);
}

function renderRoster(r) {
  const card = $("rosterCard");
  const allies = r.allies || [], enemies = r.enemies || [];
  if (!allies.length && !enemies.length) { card.hidden = true; return; }

  card.hidden = false;
  const inUscita = !!tenuta && r === tenuta.roster;
  card.classList.toggle("uscita", inUscita);
  const titolo = r.party ? t("party")
    : r.ffa ? t("players")
    : r.loop === "PREGAME" ? t("agentSelect") : t("teams");
  const resto = inUscita ? tenuta.fine - Date.now() : 0;
  $("rosterTitle").innerHTML = esc(titolo) + (inUscita
    ? `<span class="sparisce">${t("goneIn").replace("{n}", `<b>${Math.ceil(resto / 1000)}</b>`)}`
      + `<i style="animation-delay:${((resto - TENUTA_MS) / 1000).toFixed(2)}s"></i></span>`
    : "");

  const body = r.party
    ? teamCol(r.searching
        ? t("partyQueue").replace("{q}", r.queue || "?")
        : t("partyIdle"), allies)
    : r.ffa
    ? teamCol(t("ffa"), allies.concat(enemies))
    : `${teamCol(t("yourTeam"), allies)}
       ${enemies.length
        ? teamCol(t("enemies"), enemies)
        : r.enemiesHidden
        ? `<div class="team"><div class="label th">${t("enemies")}</div>
             <div class="teamnote">${t("enemiesLater")}</div></div>`
        : ""}`;

  $("rosterBox").innerHTML = `<div class="teams">${body}</div>`;
}

const teamCol = (title, rows) => `<div class="team">
    <div class="label th">${title} <em>· ${rows.length}</em></div>
    <table class="roster">
      <thead><tr>
        <th class="l ag">${t("agent")}</th><th class="l nm">${t("name")}</th>
        <th class="lv">${t("lvl")}</th>
        <th class="gm" title="${t("compGamesHint")}">${t("compGames")}</th>
        <th class="k">${t("kd")}</th><th class="s">${t("acs")}</th>
        <th class="h">${t("hs")}</th><th class="w">${t("wr")}</th>
        <th class="r">${t("rank")}</th><th class="la">${t("lastAct")}</th>
        <th class="pk">${t("peak")}</th>
        <th class="cp"></th>
      </tr></thead>
      <tbody>${rows.map((p, i) => playerRow(p, i)).join("")}</tbody>
    </table>
  </div>`;

function stat(p, read) {
  if (!p.stats) return '<td class="pending">·</td>';
  if (!p.stats.games) return "<td>—</td>";
  const v = read(p.stats);
  return `<td>${v == null ? "—" : esc(v)}</td>`;
}

const TIER_COLORS = [
  [27, "--t-radiant"], [24, "--t-immortal"], [21, "--t-ascendant"],
  [18, "--t-diamond"], [15, "--t-plat"], [12, "--t-gold"],
  [9, "--t-silver"], [6, "--t-bronze"], [3, "--t-iron"],
];
function progressoRR(tier, rr) {
  if (tier == null || rr == null) return 0;
  if (tier >= 26) return null;
  const base = tier >= 24 ? (tier - 24) * 100 : 0;
  return Math.max(0, Math.min(100, rr - base));
}

let conIcone = false;
let arte = {};

function cellaMappa(nome, cls) {
  const url = arte[nome];
  return `<td class="${cls} l${url ? " arte" : ""}"`
    + `${url ? ` style="--arte:url('${esc(url)}')"` : ""}>${esc(nome)}</td>`;
}

function tierColor(tier) {
  if (tier == null) return "var(--dim)";
  for (const [min, name] of TIER_COLORS) if (tier >= min) return `var(${name})`;
  return "var(--dim)";
}

function rankChip(tier, label, act, rr) {
  if (!label || label === "—") return '<span class="rk">—</span>';
  const extra = act ? `· ${act}`
    : (tier != null && tier >= 24 && rr != null ? `· ${rr} RR` : "");
  return `<span class="rk${conIcone && tier != null ? " ico" : ""}"`
    + ` style="--c:${tierColor(tier)}${conIcone && tier != null
        ? `;--i:url('/tier/${tier}.png')` : ""}">`
    + `<span class="lbl">${esc(label)}</span>`
    + (extra ? `<span class="act">${esc(extra)}</span>` : "") + "</span>";
}

const trackerUrl = (name) =>
  "https://tracker.gg/valorant/profile/riot/"
  + encodeURIComponent(name.replace("#", "#")) + "/overview";

function quandoFa(ms) {
  if (!ms) return "";
  const giorni = Math.floor((Date.now() - ms) / 86400000);
  if (giorni <= 0) return t("agoToday");
  if (giorni === 1) return t("agoYesterday");
  if (giorni < 14) return t("agoDays").replace("{n}", giorni);
  if (giorni < 60) return t("agoWeeks").replace("{n}", Math.round(giorni / 7));
  return t("agoMonths").replace("{n}", Math.round(giorni / 30));
}

function cifreIncontro(m) {
  const fig = (v, k, tono) => `<div class="mfig">`
    + `<div class="mv ${tono || ""}">${esc(String(v))}</div>`
    + `<div class="mk">${esc(k)}</div></div>`;
  const out = [fig(m.times, t("metGames"))];
  if (m.ally) out.push(fig(m.ally, t("metAlly")));
  if (m.enemy) out.push(fig(m.enemy, t("metFoe")));
  if (m.won + m.lost > 0) {
    out.push(fig(t("metRecShort").replace("{v}", m.won).replace("{s}", m.lost),
                 t("metBal"),
                 m.won > m.lost ? "good" : m.won < m.lost ? "bad" : ""));
  }
  return out.join("");
}

function testoIncontro(m) {
  const parti = [];
  parti.push(m.times === 1 ? t("metOnce") : t("metTimes").replace("{n}", m.times));
  const ruoli = [];
  if (m.ally) ruoli.push(t("metAsAlly").replace("{n}", m.ally));
  if (m.enemy) ruoli.push(t("metAsFoe").replace("{n}", m.enemy));
  let testa = parti[0] + (ruoli.length ? ": " + ruoli.join(", ") : "");
  const righe = [testa];
  righe.push(m.won + m.lost > 0
    ? t("metRecord").replace("{v}", m.won).replace("{s}", m.lost)
    : t("metNoRecord"));
  return righe.join(". ") + ".";
}

function targhettaIncontro(p) {
  const m = p.met;
  if (!m || !m.times) return "";
  return `<button class="metbadge" type="button" data-met="${esc(p.puuid)}"`
    + ` title="${esc(t("metOpen"))}">${m.times}×</button>`;
}

function rigaDettaglio(p) {
  const m = p.met;
  if (!m || !m.times) return "";
  const righe = (m.list || []).map((x) => {
    const esito = x.won === true ? t("metWon")
      : x.won === false ? t("metLost") : t("metNoResult");
    const segno = x.won === true ? "w" : x.won === false ? "l" : "d";
    return `<tr><td class="res"><i class="${segno}"></i></td>`
      + `<td>${esc(quandoFa(x.at))}</td>`
      + `<td class="ms">${esc(x.at ? new Date(x.at).toLocaleString(lang === "en" ? "en-GB" : "it-IT",
          { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "")}</td>`
      + `<td class="mq">${esc(x.map || "—")}</td>`
      + `<td class="ms">${esc(x.ally ? t("metWith") : t("metAgainst"))}</td>`
      + `<td class="m${segno}">${esc(esito)}</td></tr>`;
  });
  const restanti = m.times - (m.list || []).length;
  const meta = Math.ceil(righe.length / 2);
  const colonne = righe.length > 3
    ? `<table>${righe.slice(0, meta).join("")}</table>`
      + `<table>${righe.slice(meta).join("")}</table>`
    : `<table>${righe.join("")}</table>`;
  return `<tr class="metrow" data-met="${esc(p.puuid)}" hidden><td colspan="12">
      <div class="metbox">
        <div class="metstat">${cifreIncontro(m)}</div>
        <div class="metlist">${colonne}</div>
        ${restanti > 0 ? `<div class="metvia">+ ${restanti}</div>` : ""}
      </div></td></tr>`;
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest(".metbadge");
  if (!b) return;
  const chi = b.dataset.met;
  const riga = document.querySelector(`.metrow[data-met="${CSS.escape(chi)}"]`);
  if (!riga) return;
  const apri = riga.hidden;
  document.querySelectorAll(".metrow").forEach((r) => { r.hidden = true; });
  document.querySelectorAll(".metbadge").forEach((x) => {
    x.classList.remove("aperta");
  });
  riga.hidden = !apri;
  b.classList.toggle("aperta", apri);
});

function testoCopia(p) {
  const nome = p.peakTierName && p.peakTierName !== "—" ? p.peakTierName : "—";
  const conRR = p.peakTier != null && p.peakTier >= 24
    && p.tier === p.peakTier && p.rr != null;
  const peak = nome + (conRR ? ` (${p.rr} RR)` : "");
  const s = p.stats || {};
  const hs = s.hs == null ? "—" : Math.round(s.hs) + "%";
  const kd = s.kd == null ? "—" : dec(s.kd);
  const wr = s.winRate == null ? "—" : s.winRate + "%";
  const acs = s.acs == null ? "—" : s.acs;
  const chi = (!p.incognito || p.me) && p.name ? `${p.name}, ` : "";
  return `${chi}PEAK: ${peak}, HS: ${hs}, KD: ${kd}, WINRATE: ${wr}, ACS: ${acs}`;
}

async function copiaTesto(testo) {
  try {
    await navigator.clipboard.writeText(testo);
    return true;
  } catch (e) {}
  try {
    const a = document.createElement("textarea");
    a.value = testo;
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    const ok = document.execCommand("copy");
    a.remove();
    return ok;
  } catch (e) { return false; }
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest(".copybtn");
  if (!b) return;
  const ok = await copiaTesto(b.dataset.copia || "");
  b.classList.add(ok ? "fatto" : "male");
  setTimeout(() => b.classList.remove("fatto", "male"), 1200);
});

function playerRow(p, i) {
  const nascosto = p.incognito && !p.me;
  const cls = (p.me ? " me" : "") + (p.locked === false ? " soft" : "")
    + (i % 2 ? " pari" : "");
  const lvl = p.level == null ? "—" : p.level;
  const shown = nascosto
    ? `<span class="anon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>${t("anon")}</span>`
    : !p.name ? "—"
    : `<a href="${esc(trackerUrl(p.name))}" target="_blank" rel="noopener"
         title="${esc(t("openOn").replace("{n}", p.name))}">${esc(p.name)}</a>`;
  return `<tr class="${cls.trim()}">
      <td class="ag l">${esc(p.agent)}</td>
      <td class="nm l">${shown}${targhettaIncontro(p)}</td>
      <td class="lv">${esc(lvl)}</td>
      <td class="gm">${p.actGames == null ? "·" : (p.actGames || "—")}</td>
      ${stat(p, s => dec(s.kd))}
      ${stat(p, s => s.acs)}
      ${stat(p, s => s.hs == null ? null : s.hs + "%")}
      ${stat(p, s => s.winRate == null ? null : s.winRate + "%")}
      <td class="r${p.stale ? " stale" : ""}">${rankChip(p.tier, p.tierName, "", p.rr)}</td>
      <td class="la">${p.lastTier != null ? rankChip(p.lastTier, p.lastTierName, "", p.lastRR)
        : rankChip(null, p.lastPlayed == null ? "—" : t(p.lastPlayed ? "unrated" : "notPlayed"), "")}</td>
      <td class="pk">${rankChip(p.peakTier, p.peakTierName, p.peakAct)}</td>
      <td class="cp"><button class="copybtn" type="button"
        title="${esc(t("copyHint"))}" data-copia="${esc(testoCopia(p))}"></button></td>
    </tr>${rigaDettaglio(p)}`;
}

function mapRow(m) {
  const wr = m.winRate;
  const tone = wr == null ? "" : wr >= 55 ? " good" : wr < 45 ? " bad" : "";
  return `<tr>
    ${cellaMappa(m.map, "mp")}
    <td class="wr${tone}">${wr == null ? "—"
      : `<span class="wrbar"><i style="width:${wr}%"></i></span><span class="wrnum">${wr}%</span>`}</td>
    <td class="w${m.wins ? " has" : ""}">${m.wins}</td>
    <td class="ls">${m.losses}</td>
    <td>${dec(m.kd)}</td>
    <td class="${m.kda >= 1 ? "good" : "bad"}">${dec(m.kda)}</td>
    <td>${m.acs == null ? "—" : m.acs}</td>
    <td>${m.hs == null ? "—" : m.hs + "%"}</td>
    <td class="ba l">${esc(m.bestAgent || "—")}</td>
  </tr>`;
}

function actRow(a) {
  const wr = a.winRate;
  const tone = wr == null ? "" : wr >= 55 ? " good" : wr < 45 ? " bad" : "";
  const tot = a.actGames || a.games;
  const parziale = a.actGames > a.games;
  const su = parziale
    ? ` class="part" title="${esc(t("onSample").replace("{n}", a.games))}"` : "";
  return `<tr>
    <td class="mp l">${esc(a.name)} <em class="dim">· ${tot}</em></td>
    <td class="pk l">${rankChip(a.peakTier, a.peakTierName, null, a.peakRR)}</td>
    <td class="wr${tone}">${wr == null ? "—" : wr + "%"}</td>
    <td class="w${a.wins ? " has" : ""}">${a.wins}</td>
    <td class="ls">${a.losses}</td>
    <td${su}>${dec(a.kd)}</td>
    <td${su}>${a.acs == null ? "—" : Math.round(a.acs)}</td>
    <td${su}>${a.hs == null ? "—" : a.hs + "%"}</td>
  </tr>`;
}

function matchRow(m) {
  const sh = m.shots || {};
  const tot = (sh.head || 0) + (sh.body || 0) + (sh.leg || 0);
  const hs = tot ? Math.round(sh.head / tot * 100) : null;
  const res = m.won === true ? "w" : m.won === false ? "l" : "d";
  const esito = m.won === true ? t("metWon") : m.won === false ? t("metLost") : t("metNoResult");
  const rr = m.rrDelta;
  return `<tr>
    <td class="res"><span class="esito ${res}">${esc(esito)}</span></td>
    ${cellaMappa(m.map, "map")}
    <td class="agent l">${esc(m.agent)}</td>
    <td>${m.kills}</td><td>${m.deaths}</td><td>${m.assists}</td>
    ${rapporti(m.kills, m.deaths, m.assists)}
    <td>${Math.round(m.acs)}</td>
    <td>${hs == null ? "—" : hs + "%"}</td>
    <td class="rr ${rr > 0 ? "up" : rr < 0 ? "down" : ""}">${rr == null ? "—" : (rr > 0 ? "+" : "") + rr}</td>
  </tr>`;
}

function rapporti(k, d, a) {
  const kd = d ? k / d : k, kda = d ? (k + a) / d : k + a;
  const tono = (v) => (v >= 1 ? "good" : "bad");
  return `<td class="${tono(kd)}">${dec(kd)}</td><td class="${tono(kda)}">${dec(kda)}</td>`;
}

function mediaRow(ms) {
  const somma = (f) => ms.reduce((s, m) => s + (f(m) || 0), 0);
  const k = somma((m) => m.kills), d = somma((m) => m.deaths), a = somma((m) => m.assists);
  const colpi = (m) => (m.shots || {}).head + (m.shots || {}).body + (m.shots || {}).leg;
  const tot = somma(colpi), testa = somma((m) => (m.shots || {}).head);
  const conRR = ms.filter((m) => m.rrDelta != null);
  const rr = conRR.reduce((s, m) => s + m.rrDelta, 0);
  const n = ms.length;
  const vinte = ms.filter((m) => m.won === true).length;
  const perse = ms.filter((m) => m.won === false).length;
  return `<tr>
    <td class="res"><span class="esito tot">${vinte}–${perse}</span></td>
    <td class="map l" colspan="2">${t("histAvg")} · ${n}</td>
    <td>${(k / n).toFixed(1)}</td><td>${(d / n).toFixed(1)}</td><td>${(a / n).toFixed(1)}</td>
    ${rapporti(k, d, a)}
    <td>${Math.round(somma((m) => m.acs) / n)}</td>
    <td>${tot ? Math.round(testa / tot * 100) + "%" : "—"}</td>
    <td class="rr ${rr > 0 ? "up" : rr < 0 ? "down" : ""}">${conRR.length ? (rr > 0 ? "+" : "") + rr : "—"}</td>
  </tr>`;
}

const dec = (v) => (v == null || v === "" ? "—" : Number(v).toFixed(2));
const esc = (v) => String(v ?? "—").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cell = (k, v, unit, tone) =>
  `<div class="cell ${tone || ""}"><div class="label k">${k}</div>
   <div class="v">${esc(v)}${unit ? `<small>${unit}</small>` : ""}</div></div>`;

let ws = null, gotState = false;

let riconnessione = null;

function segnaCollegamento() {
  const giu = !ws || ws.readyState !== 1;
  document.body.classList.toggle("offline", giu && gotState);
}

function connect() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { clearTimeout(riconnessione); segnaCollegamento(); };
  ws.onmessage = (ev) => {
    gotState = true;
    render(JSON.parse(ev.data));
    segnaCollegamento();
  };
  ws.onclose = () => {
    segnaCollegamento();
    clearTimeout(riconnessione);
    riconnessione = setTimeout(connect, 3000);
  };
  ws.onerror = () => {};
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { clearTimeout(riconnessione); connect(); }
});
window.addEventListener("focus", () => { clearTimeout(riconnessione); connect(); });
window.addEventListener("online", () => { clearTimeout(riconnessione); connect(); });
setInterval(() => { if (gotState) connect(); }, 10000);

let caricoDa = 0, caricoSpegni = null, caricoLimite = null;

function mostraCarico(acceso) {
  const barra = $("loadbar");
  clearTimeout(caricoSpegni);
  if (acceso) {
    if (barra.hidden) { caricoDa = Date.now(); barra.hidden = false; }
    return;
  }
  const resta = 450 - (Date.now() - caricoDa);
  caricoSpegni = setTimeout(() => { barra.hidden = true; }, Math.max(0, resta));
}

$("refresh").addEventListener("click", async () => {
  mostraCarico(true);
  clearTimeout(caricoLimite);
  caricoLimite = setTimeout(() => mostraCarico(false), 25000);
  if (ws && ws.readyState === 1) { ws.send("refresh"); return; }
  connect();
  try {
    await fetch("/api/refresh", { method: "POST" });
    const r = await fetch("/api/state");
    if (r.ok) { gotState = true; render(await r.json()); }
  } catch (e) {}
  segnaCollegamento();
});

$("langBtn").addEventListener("click", () => setLang(lang === "it" ? "en" : "it"));

const FOLDED = new Set((() => {
  const salvato = localStorage.getItem("valoFolded");
  if (salvato === null) return ["acts"];
  try { return JSON.parse(salvato) || []; } catch (e) { return []; }
})());

function applyFolds() {
  document.querySelectorAll(".foldbtn").forEach((b) => {
    const chiusa = FOLDED.has(b.dataset.fold);
    b.closest(".card").classList.toggle("folded", chiusa);
    b.setAttribute("aria-expanded", String(!chiusa));
    b.title = t(chiusa ? "show" : "hide");
  });
}

let updScartata = "";

function mostraAggiornamento(u, mia) {
  const dlg = $("updCard");
  const c = u.version || "";
  if (!c || u.state === "" || u.state === undefined) {
    if (dlg.open) dlg.close();
    return;
  }
  const lavora = u.state === "scarico" || u.state === "installo"
    || u.state === "riavvio";
  if (!lavora && updScartata === c) {
    if (dlg.open) dlg.close();
    return;
  }
  const nota = $("updNote"), go = $("updGo"), dopo = $("updLater"),
        pag = $("updPage"), barra = $("updBar"), croce = $("updClose");
  croce.hidden = lavora;
  pag.href = u.page || "https://github.com/DevHachiman/valo-readout/releases";
  pag.textContent = t("updOpen");
  if (u.state === "errore") {
    const tab = t("updWhy") || {};
    nota.innerHTML = t("updFail").replace("{w}", esc(tab[u.why] || u.why || "?"));
    go.hidden = true; pag.hidden = false; dopo.hidden = false;
    barra.hidden = true;
  } else if (lavora) {
    nota.innerHTML = t("updBusy");
    go.hidden = false; go.disabled = true; pag.hidden = true; dopo.hidden = true;
    go.textContent = t(u.state === "scarico" ? "updGetting"
      : u.state === "installo" ? "updSetting" : "updRestart");
    barra.hidden = false;
    barra.firstElementChild.style.width = (u.perc || 0) + "%";
  } else {
    const avviso = t("updNew").replace("{n}", esc(c))
      .replace("{v}", esc(mia || u.have || "?"));
    nota.innerHTML = u.canInstall ? avviso : avviso + " " + t("updManual");
    go.hidden = !u.canInstall;
    go.disabled = false;
    go.textContent = t("updDo");
    pag.hidden = !!u.canInstall;
    dopo.hidden = false;
    barra.hidden = true;
  }
  if (!dlg.open) { dlg.showModal(); updAperta = true; }
}

$("updGo").addEventListener("click", async () => {
  $("updGo").disabled = true;
  try {
    await fetch("/api/update", { method: "POST" });
  } catch (e) { $("updGo").disabled = false; }
});

$("updLater").addEventListener("click", () => {
  const u = (lastState && lastState.update) || {};
  updScartata = u.version || "";
  $("updCard").close();
});

$("updClose").addEventListener("click", () => {
  const u = (lastState && lastState.update) || {};
  if (u.state === "scarico" || u.state === "installo" || u.state === "riavvio") return;
  updScartata = u.version || "";
  $("updCard").close();
});

$("updCard").addEventListener("cancel", (ev) => {
  const u = (lastState && lastState.update) || {};
  if (u.state === "scarico" || u.state === "installo" || u.state === "riavvio") {
    ev.preventDefault();
    return;
  }
  updScartata = u.version || "";
});

function mostraVersione(v) {
  const box = $("appver");
  if (box.dataset.v === String(v)) return;
  box.dataset.v = String(v);
  box.textContent = (v ? `v${v} · ` : "")
    + `© ${new Date().getFullYear()} DevHachiman · `;
  const a = document.createElement("a");
  a.href = "https://github.com/DevHachiman";
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "github.com/DevHachiman";
  box.appendChild(a);
}

mostraVersione("");

document.querySelectorAll(".foldbtn").forEach((b) => {
  b.closest("h2").addEventListener("click", () => {
    const k = b.dataset.fold;
    if (FOLDED.has(k)) FOLDED.delete(k); else FOLDED.add(k);
    localStorage.setItem("valoFolded", JSON.stringify([...FOLDED]));
    applyFolds();
  });
});
applyFolds();

async function saveKey() {
  const key = $("keyInput").value.trim();
  if (!key) return;
  const msg = $("keyMsg"), btn = $("keySave");
  btn.disabled = true;
  msg.className = "keymsg";
  msg.textContent = t("keyWait");
  try {
    const r = await fetch("/api/henrik-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key }),
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = "keymsg ok";
      msg.textContent = t(d.note === "nuovo" ? "keyNew" : "keyOk");
    } else {
      msg.className = "keymsg bad";
      msg.textContent = t("keyBad").replace("{w}", tb(d.why, d.whyEn) || "?");
    }
  } catch (e) {
    msg.className = "keymsg bad";
    msg.textContent = t("keyBad").replace("{w}", e);
  }
  btn.disabled = false;
}
$("keySave").addEventListener("click", saveKey);
$("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") saveKey(); });

$("keyClose").addEventListener("click", () => { keyOpen = false; $("keyCard").close(); });
$("keyCard").addEventListener("close", () => { keyOpen = false; });
$("keyCard").addEventListener("click", (e) => {
  if (e.target === $("keyCard")) { keyOpen = false; $("keyCard").close(); }
});

$("keyBtn").addEventListener("click", () => {
  keyOpen = !keyOpen;
  keyAsked = true;
  if (lastState) render(lastState);
  if (keyOpen) $("keyInput").focus();
});

$("keyEye").addEventListener("click", () => {
  const ki = $("keyInput"), nascosta = ki.type === "password";
  ki.type = nascosta ? "text" : "password";
  $("keyEye").textContent = t(nascosta ? "keyHide" : "keyShow");
});

$("closeBtn").addEventListener("click", async () => {
  try { await fetch("/api/quit", { method: "POST" }); } catch (e) {}
  if (ws) { ws.onclose = null; ws.close(); }
  window.close();
  document.body.innerHTML =
    `<p style="font-family:var(--mono);color:var(--muted);padding:48px 32px">${t("bye")}</p>`;
});

applyStatic();

if (location.protocol === "file:") {
  demo();
} else {
  connect();
  setTimeout(() => { if (!gotState) demo(); }, 2000);
}

function demo() {
  const maps = ["Ascent", "Haven", "Lotus", "Split", "Sunset", "Abyss"];
  const agents = ["Jett", "Reyna", "Omen", "Sova", "Killjoy", "Chamber"];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));

  const matches = [];
  for (let i = 0; i < 10; i++) {
    const won = rnd() > 0.45;
    matches.push({
      map: pick(maps), agent: pick(agents),
      kills: ri(9, 27), deaths: ri(8, 21), assists: ri(2, 9),
      acs: ri(160, 310), rounds: ri(16, 25),
      shots: { head: ri(20, 45), body: ri(70, 130), leg: ri(3, 14) },
      won, rrDelta: won ? ri(12, 26) : -ri(10, 22),
    });
  }
  const sum = (f) => matches.reduce((t, m) => t + f(m), 0);
  const k = sum(m => m.kills), d = sum(m => m.deaths), a = sum(m => m.assists);
  const head = sum(m => m.shots.head);
  const shots = head + sum(m => m.shots.body + m.shots.leg);
  const wins = matches.filter(m => m.won).length;

  const who = (name, agent, ally, tier, me) => {
    const peak = Math.min(tier + ri(0, 4), 27);
    return {
      me: !!me, ally, agent, name, locked: true, incognito: false,
      tier, tierName: TIERS[tier] || "—", stale: false,
      level: ri(40, 380),
      peakTier: peak, peakTierName: TIERS[peak] || "—",
      lastTier: Math.max(tier - 1, 3), lastTierName: TIERS[Math.max(tier - 1, 3)] || "—",
      lastRR: ri(0, 99),
      actGames: ri(0, 180),
      peakAct: pick(["V26 // ACT II", "V25 // ACT VI", "EPISODE 9 // ACT III"]),
      stats: { games: 3, kda: +(rnd() * 1.3 + 0.8).toFixed(2),
               acs: ri(150, 320), winRate: ri(0, 3) * 33 },
    };
  };

  render({
    bridge: "connected", mock: true,
    account: { name: "Esempio", tag: "EUW", region: "eu" },
    roster: {
      loop: "INGAME", map: "Ascent", queue: "Competitive",
      allies: [
        who("Esempio#EUW", "Jett", true, 19, true),
        who("Vetta#IT1", "Omen", true, 20),
        who("Corvo#900", "Killjoy", true, 19),
        who("Nadir#EUW", "Sova", true, 18),
        who("Brina#TAG", "Sage", true, 17),
      ],
      enemies: [
        who("Aster#EUW", "Raze", false, 21),
        who("Kobal#77", "Viper", false, 19),
        who("Sirio#IT2", "Chamber", false, 19),
        who("Talpa#EUW", "Skye", false, 18),
        who("Zenit#123", "Cypher", false, 16),
      ],
    },
    live: { loopState: "INGAME", loopLabel: "In partita", queue: "Competitive",
            map: "Ascent", partySize: 2, score: [8, 5], roundsPlayed: 13 },
    rank: { tier: 19, tierName: "Diamond 2", rr: 62, peakTier: 22,
            peakTierName: "Ascendant 2", actWins: 34, actGames: 61,
            actName: "Act IV" },
    recent: {
      games: matches.length, kd: +(k / d).toFixed(2), kda: +((k + a) / d).toFixed(2),
      acs: sum(m => m.acs) / matches.length, hs: +(head / shots * 100).toFixed(1),
      winRate: Math.round(wins / matches.length * 100), wins, losses: matches.length - wins,
      killsPerRound: +(k / sum(m => m.rounds)).toFixed(2),
      bestAgent: matches[0].agent, bestAgentKda: 1.31,
    },
    matches, updatedAt: Date.now() / 1000,
  });
}
